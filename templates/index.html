<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Web Consultant - 戦略アーカイブ</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    
</head>
<body>
    <div class="main-container">
        <div class="content-card">
            <h1>AI Web 戦略コンサルタント</h1>
            <div class="input-group">
                <label>企業名・店舗名</label>
                <input type="text" id="bizName" placeholder="例：村上屋餅店">
            </div>
            <div class="input-group">
                <label>現在の悩み・目標</label>
                <textarea id="goal" placeholder="例：若年層の来店を増やしたい。インスタ活用の具体策を知りたい。"></textarea>
            </div>
            <button class="generate-btn" onclick="startConsult()">分析レポートを生成する</button>
        </div>

        <div id="resultSection" class="content-card hidden" style="margin-top: 20px;">
            <div class="report-header">
                <h2>戦略レポート</h2>
                <button class="pdf-btn" onclick="saveAsPDF()">PDFとして保存</button>
            </div>
            <div id="loading" class="loading-container hidden">
                <div class="spinner"></div>
                <p>ウェブ解析士AIが戦略を練っています...</p>
            </div>
            <div id="adviceContent" class="report-body"></div>
        </div>

        <div class="content-card" style="margin-top: 40px;">
            <h2>📁 過去の分析履歴</h2>
            <div id="historyList" class="history-grid">
                </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
